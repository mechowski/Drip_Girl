name: drip-girl

services:
  app:
    image: drip-girl-app:local
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: http://localhost:3001
      TZ: Europe/Moscow
      DATABASE_URL: postgres://drip_girl_app:${DRIP_GIRL_APP_PASSWORD:-app-local-test}@db:5432/${POSTGRES_DB:-drip_girl}
      PG_POOL_MAX: 4
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-test}
      POSTGRES_DB: ${POSTGRES_DB:-drip_girl}
      DRIP_GIRL_OWNER_PASSWORD: ${DRIP_GIRL_OWNER_PASSWORD:-owner-local-test}
      DRIP_GIRL_APP_PASSWORD: ${DRIP_GIRL_APP_PASSWORD:-app-local-test}
      TZ: Europe/Moscow
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
      - -c
      - timezone=Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  migrate:
    image: drip-girl-app:local
    profiles: ["migrate"]
    command: ["node", "server/migrate.mjs"]
    environment:
      MIGRATION_DATABASE_URL: postgres://drip_girl_owner:${DRIP_GIRL_OWNER_PASSWORD:-owner-local-test}@db:5432/${POSTGRES_DB:-drip_girl}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: drip-girl-pgdata
